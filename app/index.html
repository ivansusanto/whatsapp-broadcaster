<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WhatsApp Broadcaster</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }

        label {
            font-weight: 500;
            color: #555;
            margin-bottom: 5px;
            display: block;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
            font-family: 'Segoe UI', sans-serif;
        }

        textarea {
            height: 100px;
            font-family: 'Segoe UI', sans-serif;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        #save {
            background-color: #2196F3;
        }
        
        #save:hover {
            background-color: #0b7dda;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>My Desktop App</h2>

        <label for="chrome">Chrome Path:</label>
        <input id="chrome" type="text">

        <label for="numbers">Numbers:</label>
        <textarea id="numbers"></textarea>

        <label for="message">Message:</label>
        <textarea id="message"></textarea>

        <button id="save" onclick="saveData()">Save Data</button>
        <br><br>
        <button onclick="saveAndRun()">Save and Run Broadcast</button>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
